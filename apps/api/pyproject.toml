[project]
name = "plumeai-api"
version = "0.1.0"
description = "FastAPI backend for PlumeAI — the automation builder, its assistant and the tool-calling agent."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "uvloop>=0.21",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "sse-starlette>=2.1",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "httpx>=0.27",
  "cryptography>=43",
  "openai>=1.55",
  "anthropic>=0.40",
  "jsonschema>=4.23",
  # MCP client (app/mcp). 2.x only: the 1.x client API (`streamablehttp_client`,
  # `ClientSession(read, write)`) was replaced by `Client` + `streamable_http_client`.
  "mcp>=2.2,<3",
  # The wire types (`CallToolResult`, `Tool`, the error codes) live in their own
  # distribution since 2.x and are imported directly, so they are pinned directly too.
  "mcp-types>=2.2,<3",
  "croniter>=3",
  "apscheduler>=3.10,<4",
  "psycopg[binary]>=3.2",
  "tzdata",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
