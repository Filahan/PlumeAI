events {
  worker_connections 1024;
}

http {
  # Buffering off so SSE streams pass through promptly.
  proxy_buffering off;
  proxy_cache off;
  proxy_request_buffering off;

  # Timeouts large enough for LLM streams (5 minutes).
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  send_timeout 300s;

  # Forward client IP + protocol.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  upstream api { server api:8000; }
  upstream web { server web:3000; }

  # WebSocket upgrade map (used by Next.js HMR + any future websocket route).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # All `/api/*` requests go to the FastAPI backend. The path is rewritten so the API
    # sees `/health`, `/auth/login`, etc. without the `/api` prefix.
    location /api/ {
      proxy_pass http://api/;
    }

    # Direct passthrough for FastAPI's interactive docs (dev convenience).
    location /docs {
      proxy_pass http://api/docs;
    }

    location /openapi.json {
      proxy_pass http://api/openapi.json;
    }

    # Next.js dev-mode HMR opens a websocket here — needs Upgrade/Connection headers.
    location /_next/webpack-hmr {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Everything else hits the Next.js dev server.
    location / {
      proxy_pass http://web;
    }
  }
}
